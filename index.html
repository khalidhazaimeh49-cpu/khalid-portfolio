<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khalid Hazaimeh — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@1&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a film's title sequence — bold, confident, poster-scale type with the person in front of it.
   IDEA: the portfolio behaves like a movie site: title card with the lead in front of his name, credits, the film on a phone, a poster wall, a contact sheet, the set.
   PICTURE: Khalid's cut-out portrait standing in front of HAZAIMEH, an ember-orange disc behind him.
   COLOUR and TYPE: #101010 night and #F2F0EB paper alternate by section; one accent, ember #FF5A1F. Anton for titles, Inter Tight for text, Instrument Serif italic for the small "by", Tajawal for Arabic.
   LAYOUT: full-bleed title card → credits band → "Directed by" on paper with the phone stage → poster rail → contact sheet → BTS wall → about → finale. */
:root{color-scheme:dark;--bg:#101010;--bg2:#181818;--paper:#F2F0EB;--ink:#F2F0EB;--dark:#101010;--mute:#9b9891;--mute2:#6d6a64;--line:#2a2a28;--acc:#FF5A1F;--ease:cubic-bezier(.2,.7,.1,1)}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Inter Tight",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
img,video{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:0 max(4vw,18px)}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.88;margin:0;letter-spacing:.005em}
.ser{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;text-transform:none}
.ar{font-family:Tajawal,sans-serif;font-weight:700;direction:rtl}
.mute{color:var(--mute)}
.side.l .ar,.shot .ar,.pv-in .ar,.lbx .ar{text-align:left}
.paper{background:var(--paper);color:var(--dark)}
.paper .mute{color:var(--mute2)}
.band{padding:clamp(72px,9vw,140px) 0}
.kicker{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--acc);margin:0 0 18px}
.kicker::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc)}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1s var(--ease),transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:1px solid currentColor;transition:background .3s,color .3s,border-color .3s,transform .4s var(--ease);flex:none}
.round:hover{background:var(--acc);border-color:var(--acc);color:#fff;transform:scale(1.06)}
.round svg{width:20px;height:20px}
.pillbtn{display:inline-flex;align-items:center;gap:12px;border-radius:99px;padding:14px 24px;font-weight:600;background:var(--ink);color:var(--dark);transition:background .3s,color .3s,gap .35s var(--ease);white-space:nowrap}
.pillbtn:hover{background:var(--acc);color:#fff;gap:20px}
.pillbtn svg{width:18px;height:18px}
.paper .pillbtn{background:var(--dark);color:var(--paper)}
.paper .pillbtn:hover{background:var(--acc);color:#fff}

/* nav */
.nav{position:fixed;inset:0 0 auto;z-index:60;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px max(4vw,18px);transition:background .4s,padding .4s,color .4s}
.nav.solid{background:rgba(16,16,16,.82);backdrop-filter:blur(14px);padding-block:10px}
.logo{font-family:Anton,sans-serif;font-size:24px;justify-self:start;line-height:1}
.logo i{color:var(--acc);font-style:normal}
.links{display:flex;gap:6px;align-items:center}
.links button{font-size:14px;padding:10px 12px;color:var(--mute);border-radius:99px;transition:color .3s,background .3s}
.links button:hover{color:var(--ink)}
.links button.on{color:var(--ink);background:rgba(242,240,235,.08)}
.nav-r{justify-self:end;display:flex;gap:10px;align-items:center}
.nav-r .round{width:44px;height:44px;border-color:rgba(242,240,235,.3)}
.talk{border:1px solid rgba(242,240,235,.3);border-radius:99px;padding:10px 18px;font-size:14px;transition:all .3s}
.talk:hover{background:var(--acc);border-color:var(--acc)}
.burger{display:none}
@media(max-width:960px){
 .nav{grid-template-columns:1fr auto}
 .links{position:fixed;inset:0;flex-direction:column;justify-content:center;gap:4px;background:var(--bg);clip-path:circle(0 at calc(100% - 40px) 36px);transition:clip-path .7s var(--ease);z-index:-1}
 .links.open{clip-path:circle(150% at calc(100% - 40px) 36px)}
 .links button{font-family:Anton,sans-serif;font-size:clamp(34px,9vw,54px);text-transform:uppercase;color:var(--ink)}
 .links button.on{background:none;color:var(--acc)}
 .talk{display:none}
 .burger{display:grid}
}

/* hero */
.hero{position:relative;height:100svh;min-height:620px;overflow:hidden;--p:0;--mx:0;--my:0;touch-action:pan-y;background:radial-gradient(120% 80% at 50% 40%,#1b1714,#101010 70%)}
.pg{position:absolute;inset:0;z-index:2;pointer-events:none;transform:translate3d(calc(var(--mx) * 34px),calc(var(--my) * 26px),0)}
.hero-light{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:soft-light;background:radial-gradient(420px circle at calc(50% + var(--mx) * 40%) calc(45% + var(--my) * 35%),rgba(255,200,160,.35),transparent 60%)}
.hero-first{transform:translate3d(calc(var(--mx) * -36px),0,0)}
.hero-side{translate:calc(var(--mx) * -10px) calc(var(--my) * -10px)}
.hero-roles{position:absolute;top:clamp(80px,11vh,110px);left:0;right:0;display:flex;justify-content:space-between;gap:16px;font-size:13px;color:var(--mute);z-index:4;opacity:0;animation:fade 1s .9s forwards}
.hero-roles b{color:var(--ink);font-weight:600;display:block}
.hero-first{position:absolute;left:max(4vw,18px);right:max(4vw,18px);top:calc(clamp(80px,11vh,110px) + 50px);text-align:left;font-family:Anton,sans-serif;text-transform:uppercase;font-size:clamp(18px,2vw,28px);letter-spacing:.3em;z-index:4;color:var(--acc);opacity:0;animation:fade 1s .4s forwards}
.hero-name{margin:0;position:absolute;left:0;right:0;top:calc(clamp(80px,11vh,110px) + 96px);text-align:center;font-family:Anton,sans-serif;text-transform:uppercase;font-size:min(23.5vw,40svh);line-height:.82;white-space:nowrap;transform:translate3d(calc(var(--mx) * -26px),calc(var(--my) * -14px),0) translateY(calc(var(--p) * -14%)) scale(calc(1 + var(--p) * .22));transform-origin:50% 0;pointer-events:none}
.hero-name span{display:inline-block;animation:open 1.6s var(--ease) both}
@keyframes open{from{letter-spacing:.35em;opacity:0;filter:blur(14px)}}
.hero-name.back{z-index:1;color:var(--paper)}
.hero-name.front{z-index:3;color:transparent;-webkit-text-stroke:1.2px rgba(242,240,235,.38)}
.hero-glow{position:absolute;left:50%;top:44%;width:min(62svh,74vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(calc(1 + var(--p) * .3));background:radial-gradient(circle at 50% 45%,#ff7a45,#ff5a1f 45%,#b33a0e 70%,transparent 71%);z-index:2;opacity:.95;animation:rise 1.6s .2s var(--ease) both}
@keyframes rise{from{transform:translate(-50%,-30%) scale(.6);opacity:0}}
.hero-fig{position:absolute;left:50%;bottom:0;height:min(88svh,1080px);z-index:2;transform:translateX(-50%) translateY(calc(var(--p) * 10%)) scale(calc(1 + var(--p) * .06));transform-origin:50% 100%;animation:figIn 1.5s .3s var(--ease) both}
.hero-fig{perspective:900px}
.hero-fig img{transform:translate3d(calc(var(--mx) * 16px),calc(var(--my) * 8px),0) rotateY(calc(var(--mx) * 5deg)) rotateX(calc(var(--my) * -2deg));transform-origin:50% 100%;will-change:transform;height:100%;width:auto;filter:drop-shadow(0 0 60px rgba(255,90,31,.28)) drop-shadow(0 30px 40px rgba(0,0,0,.5))}
@keyframes figIn{from{transform:translateX(-50%) translateY(14%);opacity:0}}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:34%;background:linear-gradient(transparent,rgba(16,16,16,.92));z-index:3;pointer-events:none}
.hero-side{position:absolute;right:max(4vw,18px);top:50%;writing-mode:vertical-rl;font-size:13px;color:var(--mute);z-index:4;display:flex;gap:18px;align-items:center}
.hero-side i{width:1px;height:60px;background:var(--line)}
.hero-bot{position:absolute;left:0;right:0;bottom:clamp(20px,4vh,40px);z-index:5;display:flex;justify-content:space-between;align-items:end;gap:24px;opacity:calc(1 - var(--p) * 1.6)}
.hero-bot .lead{max-width:340px}
.hero-bot .lead p{margin:0}
.hero-bot .lead .ser{font-size:clamp(24px,2.4vw,34px);line-height:1.05;color:var(--ink)}
.hero-bot .lead small{display:block;margin-top:10px;color:var(--mute);font-size:14px}
.hero-cta{display:flex;align-items:center;gap:14px}
.spin{width:96px;height:96px;position:relative;flex:none}
.spin svg{width:100%;height:100%;animation:sp 14s linear infinite}
.spin b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fade{to{opacity:1}}
@media(max-width:760px){
 .hero-name{font-size:25vw}
 .hero-roles{display:grid;grid-template-columns:1fr 1fr;row-gap:6px;font-size:12px}
 .hero-roles div:nth-child(even){text-align:right}
 .hero-first{top:calc(clamp(80px,11vh,110px) + 100px)}
 .hero-name{top:calc(clamp(80px,11vh,110px) + 132px)}
 .hero-fig{height:60svh}
 .hero::after{height:52%;background:linear-gradient(transparent,rgba(16,16,16,.85) 45%,#101010)}
 .hero-bot .lead{text-shadow:0 2px 16px rgba(0,0,0,.6)}
 .hero-side{display:none}
 .hero-bot{flex-direction:column;align-items:stretch}
 .spin{display:none}
}

/* credits band */
.credits{position:relative;border-top:1px solid var(--line)}
.stitch{height:10px;background:repeating-linear-gradient(90deg,var(--acc) 0 14px,transparent 14px 22px);opacity:.9;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.cred{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(24px,4vw,60px);align-items:center;padding-block:clamp(40px,6vw,80px)}
.cred .studios{display:flex;flex-direction:column;gap:6px}
.cred .studios small{color:var(--mute);font-size:13px}
.cred .studios b{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(22px,2.2vw,30px);text-transform:uppercase;line-height:1}
.dots{display:flex;gap:14px}
.dot{width:clamp(92px,9vw,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;align-content:center;transition:transform .5s var(--ease)}
.dot:hover{transform:translateY(-6px) rotate(-4deg)}
.dot b{font-family:Anton,sans-serif;font-weight:400;font-size:clamp(30px,3vw,42px);line-height:1}
.dot small{font-size:12px;margin-top:4px}
.dot.w{background:var(--paper);color:var(--dark)}
.dot.o{background:var(--acc);color:#fff}
.dot.l{border:1px solid var(--line)}
.cred p{margin:0;color:var(--mute);max-width:36ch;justify-self:end}
.cred p b{color:var(--ink);font-weight:500}
@media(max-width:900px){.cred{grid-template-columns:minmax(0,1fr)}.cred p{justify-self:start}}

/* directed by + phone stage */
.dirby{text-align:center;padding-top:clamp(80px,10vw,150px)}
.dirby h2{font-size:clamp(54px,11.5vw,190px);display:flex;justify-content:center;align-items:baseline;gap:.12em;flex-wrap:wrap}
.dirby h2 .ser{font-size:.32em;color:var(--acc)}
.dirby .sub{font-family:Anton,sans-serif;text-transform:uppercase;font-size:clamp(20px,2.2vw,30px);line-height:1.1;margin:28px auto 0;max-width:24em}
.stage{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:clamp(20px,4vw,64px);align-items:center;padding:clamp(50px,7vw,100px) 0 clamp(80px,10vw,150px)}
.phone{position:relative;width:clamp(250px,24vw,340px);aspect-ratio:9/19;border-radius:46px;background:#0b0b0b;padding:11px;box-shadow:0 50px 80px -30px rgba(0,0,0,.45),0 0 0 1px #2a2a2a inset}
.phone::before{content:"";position:absolute;top:22px;left:50%;width:90px;height:24px;margin-left:-45px;border-radius:20px;background:#000;z-index:2}
.phone video{width:100%;height:100%;object-fit:cover;border-radius:36px;background:#000}
.phone .snd{position:absolute;right:22px;bottom:24px;z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(16,16,16,.7);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center}
.phone .snd svg{width:20px;height:20px}
.side{display:flex;flex-direction:column;gap:22px}
.side.r{align-items:flex-end;text-align:right}
.float{position:relative;width:min(220px,80%);aspect-ratio:3/4;border-radius:16px;overflow:hidden;box-shadow:0 30px 50px -24px rgba(0,0,0,.4);transition:transform .7s var(--ease)}
.float img{width:100%;height:100%;object-fit:cover}
.side.l .float{transform:rotate(-6deg)}
.side.r .float{transform:rotate(6deg)}
.side .float:hover{transform:rotate(0) scale(1.04)}
.fmeta h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(28px,2.8vw,40px);line-height:1;margin:0}
.fmeta .ar{font-size:18px;margin:6px 0 0}
.fmeta p{margin:10px 0 0;font-size:15px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.side.r .tabs{justify-content:flex-end}
.tabs button{border:1px solid rgba(16,16,16,.2);border-radius:99px;padding:10px 16px;font-size:14px;transition:all .3s}
.tabs button.on{background:var(--dark);color:var(--paper);border-color:var(--dark)}
.tabs button:hover{border-color:var(--dark)}
@media(max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.phone{margin:0 auto;order:-1}.side,.side.r{align-items:center;text-align:center}.side.r .tabs{justify-content:center}.float{display:none}}

/* section heads */
.shead{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:clamp(36px,5vw,64px)}
.shead h2{font-size:clamp(52px,8vw,128px)}
.shead p{margin:0;max-width:32em}

/* design rail */
.rail-wrap{position:relative}
.rail{display:flex;gap:clamp(14px,2vw,28px);overflow-x:auto;scroll-snap-type:x mandatory;padding:20px calc(50vw - 160px) 30px;scrollbar-width:none;align-items:center}
.rail::-webkit-scrollbar{display:none}
.poster{flex:none;scroll-snap-align:center;height:min(66svh,640px);border-radius:10px;overflow:hidden;background:var(--bg2);transform:scale(.84);opacity:.45;filter:saturate(.6);transition:transform .7s var(--ease),opacity .6s,filter .6s;box-shadow:0 40px 60px -30px rgba(0,0,0,.8)}
.poster img{height:100%;width:auto}
.poster.on{transform:none;opacity:1;filter:none}
.rail-info{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;margin-top:24px}
.count{font-family:Anton,sans-serif;font-size:clamp(40px,5vw,72px);line-height:1}
.count small{font-size:.4em;color:var(--mute)}
.rinfo{text-align:center;min-height:120px}
.rinfo h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(26px,3vw,44px);line-height:1;margin:0}
.rinfo .ar{margin:8px 0 0;font-size:18px;color:var(--mute)}
.rinfo p{margin:8px auto 0;max-width:46ch;color:var(--mute);font-size:15px}
.rinfo .tag{display:inline-block;margin-top:10px;font-size:13px;color:var(--acc)}
.rnav{display:flex;gap:10px;justify-content:flex-end}
@media(max-width:760px){.rail{padding-inline:calc(50vw - 120px)}.poster{height:min(58svh,520px)}.rail-info{grid-template-columns:auto auto;}.rinfo{grid-column:1/-1;order:-1}}

.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:-20px;margin-bottom:10px}
.dtabs button{border:1px solid var(--line);border-radius:99px;padding:11px 18px;font-size:15px;color:var(--mute);transition:all .3s;min-height:44px}
.dtabs button:hover{border-color:var(--ink);color:var(--ink)}
.dtabs button.on{background:var(--ink);color:var(--dark);border-color:var(--ink)}
.dtabs sup{font-size:11px;margin-left:4px;opacity:.6}
@media(max-width:760px){.dtabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:-10px}.dtabs::-webkit-scrollbar{display:none}.dtabs button{flex:none;font-size:14px;padding:10px 15px}}
.round:disabled{opacity:.3;pointer-events:none}
/* contact sheet (photography) */
.sheet{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(12px,1.6vw,24px);align-items:start}
.shot{position:relative;text-align:left;transition:transform .7s var(--ease)}
.shot:nth-child(even){margin-top:clamp(30px,6vw,90px)}
.shot .frame{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#ddd}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.shot:hover img{transform:scale(1.06)}
.shot .no{position:absolute;top:12px;left:12px;background:var(--paper);color:var(--dark);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600}
.shot h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(20px,1.8vw,26px);line-height:1;margin:14px 0 0}
.shot .ar{font-size:15px;margin:4px 0 0;color:var(--mute2)}
.shot small{display:block;margin-top:6px;font-size:13px;color:var(--mute2)}
@media(max-width:760px){.sheet{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* bts */
#bts .sheet+.sheet{margin-top:clamp(50px,7vw,100px)}
#bts .sheet.five{grid-template-columns:repeat(5,minmax(0,1fr))}
#bts .shot img{object-position:50% 50%}
@media(max-width:760px){#bts .sheet.five{grid-template-columns:repeat(2,minmax(0,1fr))}}
#bts .shot .frame{background:var(--bg2)}
#bts .shot video{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
#bts .shot:hover video{transform:scale(1.06)}
#bts .shot small{color:var(--mute)}
#bts .shot .play{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:rgba(16,16,16,.6);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:13px;color:#fff;transition:background .3s}
#bts .shot:hover .play{background:var(--acc)}
.bts{columns:3 260px;column-gap:14px}
.bts-item{position:relative;display:block;width:100%;margin:0 0 14px;break-inside:avoid;border-radius:10px;overflow:hidden;background:var(--bg2)}
.bts-item img,.bts-item video{width:100%;height:auto;transition:transform 1.2s var(--ease),filter .6s;filter:saturate(.9)}
.bts-item video{aspect-ratio:9/16;object-fit:cover}
.bts-item:hover img,.bts-item:hover video{transform:scale(1.04);filter:none}
.bts-cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-size:14px;text-align:left}
.badge{position:absolute;top:12px;left:12px;background:rgba(16,16,16,.75);backdrop-filter:blur(6px);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:#fff;z-index:2}

/* about + experience */
.about{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(32px,6vw,100px)}
.about .big{font-size:clamp(28px,3.4vw,50px);line-height:1.12;margin:0;text-wrap:balance;font-weight:500}
.about .big .ser{color:var(--acc)}
.about .cols p{margin:0 0 18px;color:var(--mute2)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.tags span{border:1px solid rgba(16,16,16,.18);border-radius:99px;padding:8px 15px;font-size:14px}
.xp{list-style:none;margin:clamp(60px,8vw,110px) 0 0;padding:0;border-top:1px solid rgba(16,16,16,.15)}
.xp li{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,3fr) minmax(0,5fr);gap:24px;align-items:baseline;padding:clamp(22px,3vw,36px) 0;border-bottom:1px solid rgba(16,16,16,.15);transition:padding .5s var(--ease)}
.xp li:hover{padding-inline:14px}
.xp h3{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(30px,3.6vw,52px);margin:0;line-height:1}
.xp .role{margin:0;font-weight:600}

  useReveal();
  const [film, setFilm] = useState(() => { const h = location.hash.slice(1); return FILMS.some(f => f.id === h) ? h : null; });
  const [lb, setLb] = useState(null), [msg, setMsg] = useState(""), [active, setActive] = useState("");
  const toast = m => { setMsg(m); setTimeout(() => setMsg(""), 2200); };
  const openFilm = id => { setFilm(id); try { history.replaceState(null, "", "#" + id); } catch (e) {} };
  const closeFilm = () => { setFilm(null); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} };
  const view = (list, i) => setLb({list, i});
  useEffect(() => {
    const ids = ["films", "design", "photography", "bts", "about", "contact"];
    const so = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && setActive(e.target.id)), {rootMargin: "-45% 0px -50% 0px"});
    ids.forEach(i => { const el = document.getElementById(i); el && so.observe(el); });
    const h = () => { const id = location.hash.slice(1); if (FILMS.some(f => f.id === id)) setFilm(id); }; addEventListener("hashchange", h);
    return () => { so.disconnect(); removeEventListener("hashchange", h); };
  }, []);
  return html`<${React.Fragment}>
    <${Nav} active=${active}/>
    <main>
      <${Hero}/><${Credits}/><${Films} onOpen=${openFilm}/><${Design} onView=${view}/><${Photos} onView=${view}/><${Bts} onView=${view}/><${About}/><${Finale} toast=${toast}/>
    </main>
    ${film && html`<${FilmView} id=${film} onClose=${closeFilm}/>`}
    ${lb && html`<${Lightbox} list=${lb.list} i=${lb.i} setI=${i => setLb({...lb, i})} onClose=${() => setLb(null)}/>`}
    ${msg && html`<div class="toast" role="status">${msg}</div>`}
  <//>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
}
</script>
</body>
</html>
